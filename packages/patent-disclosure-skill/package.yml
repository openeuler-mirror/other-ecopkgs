name: patent-disclosure-skill
category: others
type: 源码安装
description: AI agent skill for generating and managing patent disclosure documents
license: MIT
homepage: https://github.com/handsomestWei/patent-disclosure-skill

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 环境准备 / 前置条件
    ```
    # 系统依赖（Python >= 3.8，推荐 >= 3.10）
    sudo dnf install -y python3 python3-pip python3-devel git gcc
    python3 --version

    # 推荐使用 uv 或 pip 国内镜像
    curl -LsSf https://astral.sh/uv/install.sh | sh
    uv venv .venv && source .venv/bin/activate
    # 或
    pip config set global.index-url https://mirrors.aliyun.com/pypi/simple/
    ```

  - 安装
    ```
    # 方式一：通过 pip 安装（推荐）
    pip install -i https://mirrors.aliyun.com/pypi/simple/ patent-disclosure-skill

    # 方式二：从源码安装
    git clone https://github.com/handsomestWei/patent-disclosure-skill.git
    cd patent-disclosure-skill
    pip install -e .
    ```

  - 初始化 / 基础配置
    ```
    # 如需使用 AI 辅助生成功能，配置 API Key
    export OPENAI_API_KEY="sk-your-api-key"

    # 配置文件 config.yaml
    ai:
      provider: "openai"
      model: "gpt-4o"
      api_key: "${OPENAI_API_KEY}"
      temperature: 0.3

    patent:
      jurisdiction: "US"
      language: "en"
      output_dir: "./patents"
    ```

  - 启动 / 快速使用
    ```
    # 命令行用法
    patent-disclosure generate --input description.txt --output disclosure.md
    patent-disclosure check --input disclosure.md
    patent-disclosure export --input disclosure.md --format pdf
    ```

  - 验证安装
    ```
    python -c "import patent_disclosure_skill; print('安装成功')"
    ```

  - 卸载
    ```
    pip uninstall patent-disclosure-skill -y
    rm -rf ~/.patent_disclosure_skill
    ```