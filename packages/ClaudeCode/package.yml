name: ClaudeCode
category: others
type: 源码安装
description: Anthropic terminal AI coding assistant that edits files, runs commands and integrates Git
license: unknown
homepage: https://github.com/anthropics/claude-code

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    node --version
    # 需要 >= 18
    npm --version
    # 需要 >= 8

    # 依赖不满足时，在 openEuler 上安装
    sudo dnf install -y nodejs npm git
    # 或安装 LTS 版本
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
    source ~/.bashrc && nvm install --lts
    # 配置国内镜像源
    npm config set registry https://registry.npmmirror.com
    ```

  - 安装
    ```
    # npm 全局安装（推荐）
    npm install -g @anthropic/claude-code

    # 备选：通过 npx 直接使用
    npx @anthropic/claude-code
    ```

  - 验证安装
    ```
    claude --version
    # 应输出版本号
    ```

  - 基础配置
    ```
    # 配置 API Key（以 sk-ant- 开头，可在 https://console.anthropic.com 获取）
    export ANTHROPIC_API_KEY="sk-ant-xxx"

    # 配置文件 ~/.config/claude-code/config.json
    {
      "apiKey": "sk-ant-xxx",
      "model": "claude-sonnet-4-20250514",
      "temperature": 0.3,
      "maxTokens": 8192,
      "autoExecute": false,
      "gitIntegration": true
    }
    ```

  - 启动 / 快速使用
    ```
    claude                          # 启动交互模式
    claude "解释一下这个项目的架构"   # 单次问答

    claude                                    # 启动交互模式
    claude --model claude-sonnet-4-20250514   # 指定模型
    claude --init                             # 初始化配置
    claude doctor                             # 配置诊断
    claude --help                             # 查看帮助
    ```

  - 卸载
    ```
    npm uninstall -g @anthropic/claude-code
    rm -rf ~/.config/claude-code
    ```