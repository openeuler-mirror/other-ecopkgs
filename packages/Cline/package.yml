name: Cline
category: others
type: 源码安装
description: VS Code extension AI coding agent that edits code and runs terminal commands in the IDE
license: Apache-2.0
homepage: https://github.com/cline/cline

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    code --version
    # 需要 >= 1.80
    node --version
    # 需要 >= 18

    # 若 Node.js / npm 不满足，可在 openEuler 上安装
    sudo dnf install -y nodejs npm
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
    source ~/.bashrc && nvm install --lts
    npm config set registry https://registry.npmmirror.com
    ```

  - 安装
    ```
    # 从 VS Code 市场安装（推荐）
    # 打开 VS Code -> 扩展面板（Ctrl+Shift+X）-> 搜索 "Cline" -> 点击安装

    # 备选：命令行安装
    code --install-extension cline.cline
    ```

  - 验证安装
    ```
    # 在 VS Code 中按 Ctrl+Shift+P，输入 "Cline: Open"，确认扩展能正常打开
    ```

  - 基础配置
    ```
    # 配置 API Key（Ctrl+Shift+P -> Cline: Open Settings 选择 Provider 填入）
    export ANTHROPIC_API_KEY="sk-ant-xxx"
    export OPENAI_API_KEY="sk-xxx"
    export GEMINI_API_KEY="your-api-key"

    # 配置文件 ~/.config/cline/config.json
    {
      "provider": "anthropic",
      "model": "claude-sonnet-4-20250514",
      "temperature": 0.3,
      "maxTokens": 8192,
      "allowedTools": ["read", "write", "edit", "terminal", "glob"],
      "autoExecute": false
    }
    ```

  - 快速使用
    ```
    Ctrl+Shift+P → Cline: Open          # 打开 Cline 面板
    Ctrl+Shift+P → Cline: New Session   # 新建会话
    Ctrl+Shift+P → Cline: Settings      # 打开设置
    ```

  - 卸载
    ```
    code --uninstall-extension cline.cline
    ```