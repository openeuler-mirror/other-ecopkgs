name: aider
category: others
type: 源码安装
description: AI pair programming tool that collaborates on code in a Git repo and auto-creates commits
license: Apache-2.0
homepage: https://github.com/paul-gauthier/aider

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    python --version
    # 需要 >= 3.9
    git --version
    # 需要 >= 2.0

    # 若 Python / pip / Git / 编译工具链不满足，可在 openEuler 上安装
    sudo dnf install -y python3 python3-pip python3-devel git gcc
    curl -LsSf https://astral.sh/uv/install.sh | sh
    uv venv .venv && source .venv/bin/activate
    uv pip install aider-chat
    # 或 pip + 国内镜像
    pip install -i https://mirrors.aliyun.com/pypi/simple/ aider-chat
    ```

  - 安装
    ```
    # pip 安装（推荐，在虚拟环境中）
    source .venv/bin/activate
    pip install aider-chat
    # 国内镜像加速
    pip install -i https://mirrors.aliyun.com/pypi/simple/ aider-chat

    # 备选：uv 安装
    uv pip install aider-chat
    ```

  - 验证安装
    ```
    aider --version
    # 应输出版本号信息
    ```

  - 基础配置
    ```
    # 配置 API Key
    export OPENAI_API_KEY="sk-your-api-key"
    export ANTHROPIC_API_KEY="sk-ant-your-api-key"
    export DEEPSEEK_API_KEY="your-deepseek-api-key"

    # 配置文件 ~/.aider.conf.yml
    model: gpt-4o
    openai-api-key: sk-your-api-key
    auto-commits: true
    git: true
    lint: true
    ```

  - 快速使用
    ```
    cd your-project
    aider                          # 启动交互模式
    aider "描述要做的修改"         # 直接在命令行指定任务
    aider --model gpt-4o           # 指定模型

    # 在 aider 中的特殊命令
    /add src/file.py               # 添加文件到上下文
    /diff                          # 显示修改
    /commit                        # 提交修改
    ```

  - 卸载
    ```
    pip uninstall aider-chat -y
    rm -rf ~/.aider.conf.yml ~/.aider .venv
    ```