name: Open-WebUI
category: others
type: 源码安装
description: Self-hosted AI chat interface for Ollama and OpenAI-compatible APIs
license: NOASSERTION
homepage: https://github.com/open-webui/open-webui

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    docker --version
    docker compose version
    # Docker >= 20.10

    sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
    sudo systemctl enable --now docker
    docker --version
    ```

  - 安装
    ```
    # 方式一：Docker 部署（推荐），连接本地 Ollama
    docker run -d \
      --name open-webui \
      -p 3000:8080 \
      -v open-webui:/app/backend/data \
      --network=host \
      ghcr.io/open-webui/open-webui:main

    # 方式二：Docker Compose 部署（含 Ollama）
    # 创建 docker-compose.yml：
    services:
      open-webui:
        image: ghcr.io/open-webui/open-webui:main
        ports:
          - "3000:8080"
        volumes:
          - open-webui-data:/app/backend/data
        environment:
          - OLLAMA_BASE_URL=http://ollama:11434
        depends_on:
          - ollama
        restart: unless-stopped

      ollama:
        image: ollama/ollama:latest
        volumes:
          - ollama-data:/root/.ollama
        ports:
          - "11434:11434"
        restart: unless-stopped

    volumes:
      open-webui-data:
      ollama-data:

    docker compose up -d
    docker compose exec ollama ollama pull llama3.2
    ```

  - 基础配置
    ```
    # Ollama 连接
    OLLAMA_BASE_URL=http://localhost:11434

    # OpenAI 兼容 API
    OPENAI_API_KEY=sk-xxx
    OPENAI_API_BASE_URL=https://api.openai.com/v1

    # 用户注册
    ENABLE_SIGNUP=true
    ```

  - 快速使用
    ```
    # 1. 打开 http://localhost:3000
    # 2. 使用管理员账号登录
    # 3. 选择模型开始对话
    # 4. 上传文档进行 RAG 问答

    # 常用命令
    docker compose up -d                          # 启动
    docker compose down                           # 停止
    docker compose logs -f                        # 查看日志
    docker compose exec ollama ollama pull qwen2.5  # 拉取模型
    ```

  - 验证安装
    ```
    curl http://localhost:3000/health
    # 首次访问 http://localhost:3000 需注册管理员账号
    ```

  - 卸载
    ```
    docker compose down -v   # -v 删除数据卷
    docker rmi ghcr.io/open-webui/open-webui:main
    docker rmi ollama/ollama:latest
    ```