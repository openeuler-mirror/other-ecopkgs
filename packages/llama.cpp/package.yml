name: llama.cpp
category: others
type: 源码安装
description: Inference of several LLM models in C/C++
license: MIT
homepage: https://github.com/ggml-org/llama.cpp

maintainer: zhoudong01
maintainer-email: 2622533158@qq.com

usage: |

  - 前置条件
    ```
    - 系统依赖：`cmake`、`gcc-c++`、`make`
    ```

  - 获取源码（tag: `b10456`）
    ```
    git clone --depth 1 --branch b10456 https://github.com/ggml-org/llama.cpp.git
    cd llama.cpp
    ```

  - 编译软件包（纯 CPU）
    ```
    cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CANN=OFF
    cmake --build build --config Release
    ```

  - 验证编译结果
    ```
    ./build/bin/llama-cli --version
    ```

  - 验证 CPU 推理（可选）
    ```
    ./build/bin/llama-cli \
      -m /path/to/model.gguf \
      -p "Hello" \
      -n 32 \
      -ngl 0 \
      -st
    ```

  - 说明
    ```
    - 当前为纯 CPU 构建，不依赖 CANN / NPU。
    - `-ngl 0` 表示不把层卸载到加速器，全部在 CPU 上运行。
    - `-st` 为单轮对话后退出，避免进入交互模式。
    - `b10456` 已可作为 git tag 拉取。
    - 更多信息参见：https://github.com/ggml-org/llama.cpp/blob/master/docs/build.md
    ```
