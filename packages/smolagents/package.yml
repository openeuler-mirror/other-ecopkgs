name: smolagents
category: others
type: 源码安装
description: Lightweight agent framework by HuggingFace
license: Apache-2.0
homepage: https://github.com/huggingface/smolagents

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    # 检查 Python 版本（需要 >= 3.10）
    python --version

    # 安装 Python 与编译依赖
    sudo dnf install -y python3 python3-pip python3-devel git gcc

    # 推荐使用 uv 创建隔离环境并安装
    curl -LsSf https://astral.sh/uv/install.sh | sh
    uv venv .venv && source .venv/bin/activate
    uv pip install smolagents

    # 或使用 pip + 国内 PyPI 镜像源
    pip install -i https://mirrors.aliyun.com/pypi/simple/ smolagents
    ```

  - 安装
    ```
    # 方式一：pip 安装（推荐）
    python -m venv smolagents-env
    source smolagents-env/bin/activate
    pip install -i https://mirrors.aliyun.com/pypi/simple/ smolagents

    # 方式二：从源码安装（备选）
    git clone https://github.com/huggingface/smolagents.git
    cd smolagents
    pip install -i https://mirrors.aliyun.com/pypi/simple/ -e .
    ```

  - 基础配置
    ```
    # OpenAI
    export OPENAI_API_KEY="sk-your-api-key"

    # 或使用 HuggingFace 模型
    export HF_TOKEN="your-huggingface-token"

    # 使用 HuggingFace 模型配置示例
    from smolagents import CodeAgent, HfApiModel

    model = HfApiModel("Qwen/Qwen2.5-72B-Instruct")

    agent = CodeAgent(
        tools=[],
        model=model,
        add_base_tools=True
    )
    ```

  - 快速使用
    ```
    from smolagents import CodeAgent, OpenAIServerModel

    model = OpenAIServerModel(
        model_id="gpt-4o",
        api_key="sk-your-api-key"
    )

    agent = CodeAgent(
        tools=[],
        model=model,
        add_base_tools=True
    )

    response = agent.run("计算 15 的平方根是多少？")
    print(response)
    ```

  - 验证安装
    ```
    python -c "import smolagents; print(smolagents.__version__)"
    # 应输出版本号信息

    python -c "
    from smolagents import CodeAgent, OpenAIServerModel

    model = OpenAIServerModel(
        model_id='gpt-4o-mini',
        api_key='$OPENAI_API_KEY'
    )

    agent = CodeAgent(
        tools=[],
        model=model,
        add_base_tools=True
    )

    result = agent.run('返回数字 42')
    print('smolagents is working!')
    "
    ```

  - 卸载
    ```
    pip uninstall smolagents -y
    ```