name: sglang-npu
category: others
type: 源码安装
description: SGLang Ascend NPU backend for openEuler (CANN / torch-npu / triton-ascend)
license: Apache-2.0
homepage: https://github.com/sgl-project/sglang

maintainer: zhoudong01
maintainer-email: 2622533158@qq.com

usage: |

  - 推荐 python 版本
    ```
    python == 3.11（CANN 9.0.0 栈）
    指导文档：https://docs.python.org/zh-cn/3/using/index.html
    ```

  - 前置条件
    ```
    - 已安装 Ascend NPU 驱动/固件，可通过 `npu-smi info` 确认
    - 已安装匹配版本的 CANN（含 toolkit / NNAL），并完成环境变量配置
    - 参考栈：CANN 9.0.0、torch/torch_npu 2.10.0、triton-ascend 3.2.1
    - 系统依赖：`python3-devel`（编译部分 Python 扩展需要）、OpenGL 相关库（`mesa-libGL` / `libglvnd-glx`，避免 opencv 缺 `libGL.so.1`）
    ```

  - 配置 CANN 环境变量
    ```
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    source /usr/local/Ascend/nnal/atb/set_env.sh
    ```

  - 创建隔离环境(可选)
    ```
    python -m venv sglang-npu
    source sglang-npu/bin/activate
    python -m pip install --upgrade pip
    pip config set global.index-url https://mirrors.aliyun.com/pypi/simple/
    pip config set global.trusted-host mirrors.aliyun.com
    ```

  - 安装软件包
    ```
    # PyTorch (CPU) + torch_npu（以 aarch64 / cp311 为例）
    pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
    pip install https://gitcode.com/Ascend/pytorch/releases/download/v26.0.0-pytorch2.10.0/torch_npu-2.10.0-cp311-cp311-manylinux_2_28_aarch64.whl

    # triton-ascend 3.2.1
    pip install https://gitcode.com/Ascend/triton-ascend/releases/download/v3.2.1/triton_ascend-3.2.1-cp311-cp311-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl

    # 安装 SGLang NPU 扩展
    git clone --depth 1 --branch v0.5.16 https://github.com/sgl-project/sglang.git
    cd sglang/python
    rm -f pyproject.toml && mv pyproject_npu.toml pyproject.toml
    pip install -v -e ".[all_npu]"

    # 直接安装预编译 sgl-kernel-npu / deep_ep（无需本地编译）
    # 包名中硬件后缀：A2 为 910b，A3 为 a3
    export SGLANG_KERNEL_NPU_TAG=2026.6.0
    export CANN_VERSION=9.0.0
    # A2:
    export DEVICE_TYPE=910b
    # A3:
    # export DEVICE_TYPE=a3
    mkdir -p /tmp/sgl-kernel-npu && cd /tmp/sgl-kernel-npu
    wget https://github.com/sgl-project/sgl-kernel-npu/releases/download/${SGLANG_KERNEL_NPU_TAG}/sgl-kernel-npu-${SGLANG_KERNEL_NPU_TAG}-torch2.10.0-py311-cann${CANN_VERSION}-${DEVICE_TYPE}-$(arch).zip
    unzip sgl-kernel-npu-${SGLANG_KERNEL_NPU_TAG}-torch2.10.0-py311-cann${CANN_VERSION}-${DEVICE_TYPE}-$(arch).zip
    pip install deep_ep*.whl sgl_kernel_npu*.whl attentions*.whl torch_memory_saver*.whl
    ```

  - 验证安装
    ```
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    source /usr/local/Ascend/nnal/atb/set_env.sh
    python -c "import torch; import torch_npu; print(torch.__version__, torch_npu.__version__, torch.npu.is_available())"
    python -c "import sglang, importlib.metadata as m; print(getattr(sglang, '__version__', None) or m.version('sglang'))"
    ```

  - 说明
    ```
    - `sgl-kernel-npu` 预编译包命名示例：
      - A2：`sgl-kernel-npu-2026.6.0-torch2.10.0-py311-cann9.0.0-910b-aarch64.zip`
      - A3：`sgl-kernel-npu-2026.6.0-torch2.10.0-py311-cann9.0.0-a3-aarch64.zip`
    - `sgl-kernel-npu` / `deep_ep` 使用 GitHub Releases 预编译 wheel 安装即可，无需本地编译。
    - `triton-ascend==3.2.1` 需从 gitcode/华为昇腾相关发布页获取，普通 PyPI 无此版本。
    - NNAL（`libatb.so`）需与 CANN 大版本匹配，并执行 `source .../nnal/atb/set_env.sh`。
    - 更多信息参见：https://docs.sglang.ai/
    ```
