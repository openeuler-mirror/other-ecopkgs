name: vLLM
category: others
type: 源码安装
description: High-performance LLM inference engine with PagedAttention
license: Apache-2.0
homepage: https://github.com/vllm-project/vllm

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    python --version
    nvcc --version
    nvidia-smi
    # Python >= 3.9、CUDA >= 11.8

    sudo dnf install -y python3 python3-pip python3-devel git gcc
    curl -LsSf https://astral.sh/uv/install.sh | sh
    uv venv .venv && source .venv/bin/activate
    # 如需 GPU 支持，请按 NVIDIA 官方源安装 CUDA 工具包
    ```

  - 安装
    ```
    # 方式一：通过 pip 安装（推荐）
    uv pip install vllm

    # 或使用 pip + 国内镜像
    pip install -i https://mirrors.aliyun.com/pypi/simple/ vllm

    # 方式二：Docker 部署
    docker run --gpus all \
      -p 8000:8000 \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      vllm/vllm-openai:latest \
      --model meta-llama/Meta-Llama-3.1-8B-Instruct
    ```

  - 基础配置
    ```
    # 如需访问受限模型
    export HUGGING_FACE_HUB_TOKEN="hf_xxx"
    ```

  - 快速使用
    ```
    # 启动 API 服务
    python -m vllm.entrypoints.openai.api_server \
      --model meta-llama/Meta-Llama-3.1-8B-Instruct \
      --gpu-memory-utilization 0.9 \
      --max-model-len 8192

    # 测试 API
    curl http://localhost:8000/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{"model": "meta-llama/Meta-Llama-3.1-8B-Instruct", "messages": [{"role": "user", "content": "Say hello"}]}'

    # 常用命令
    python -m vllm.entrypoints.openai.api_server  # 启动 API 服务
    vllm serve <model>                            # 简化启动命令
    ```

  - 验证安装
    ```
    python -c "import vllm; print(vllm.__version__)"
    ```

  - 卸载
    ```
    pip uninstall vllm -y
    ```