name: CodexCLI
category: others
type: 源码安装
description: OpenAI Codex command-line coding assistant to generate code, run commands and debug projects
license: Apache-2.0
homepage: https://github.com/openai/codex

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    node --version
    # 需要 >= 18
    npm --version
    # 需要 >= 8

    # 若 Node.js / npm 不满足，可在 openEuler 上安装
    sudo dnf install -y nodejs npm
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
    source ~/.bashrc && nvm install --lts
    npm config set registry https://registry.npmmirror.com
    ```

  - 安装
    ```
    # npm 全局安装（推荐）
    npm install -g @openai/codex

    # 备选：通过 npx 直接使用
    npx @openai/codex
    ```

  - 验证安装
    ```
    codex --version
    # 应输出版本号
    ```

  - 基础配置
    ```
    # 配置 API Key
    export OPENAI_API_KEY="sk-xxx"

    # 配置文件 ~/.config/codex/config.json
    {
      "apiKey": "sk-xxx",
      "model": "o3-mini",
      "temperature": 0.2,
      "maxTokens": 16384,
      "autoExecute": false,
      "gitIntegration": true,
      "theme": "dark"
    }
    ```

  - 启动 / 快速使用
    ```
    codex
    # 在项目目录中直接提问
    codex "这个项目的依赖管理方式是什么？"

    codex                              # 启动交互模式
    codex "问题"                       # 单次问答
    codex --model o3-mini             # 指定模型
    codex doctor                      # 诊断配置问题
    codex --help                      # 查看帮助
    ```

  - 卸载
    ```
    npm uninstall -g @openai/codex
    rm -rf ~/.config/codex
    ```