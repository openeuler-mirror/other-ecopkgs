name: humanizer
category: others
type: 源码安装
description: Tool that rewrites AI-generated text into natural human-like style
license: MIT
homepage: https://github.com/blader/humanizer

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    # 检查 Python 版本
    python --version
    # 需要 >= 3.8

    # 依赖不满足时，在 openEuler 上安装
    sudo dnf install -y python3 python3-pip python3-devel git gcc
    curl -LsSf https://astral.sh/uv/install.sh | sh
    uv venv .venv && source .venv/bin/activate
    uv pip install humanizer-agent

    # 或 pip + 国内镜像
    pip install -i https://mirrors.aliyun.com/pypi/simple/ humanizer-agent
    ```

  - 安装
    ```
    # 通过 pip 安装（推荐）
    pip install humanizer-agent
    ```

  - 基础配置
    ```
    # 配置 API Key
    export OPENAI_API_KEY="sk-xxx"
    export ANTHROPIC_API_KEY="sk-ant-xxx"

    # 配置文件位于 ~/.config/humanizer/config.json
    {
      "provider": "openai",
      "model": "gpt-4o",
      "temperature": 0.7,
      "style": "conversational",
      "preserve_length": true,
      "batch_size": 10
    }
    ```

  - 快速使用
    ```
    humanizer input.txt -o output.txt     # 处理文件
    echo "AI generated text here" | humanizer   # 处理标准输入

    humanizer --style casual "你的文本"    # 指定风格
    humanizer --formality low "你的文本"   # 指定正式程度
    humanizer --batch ./inputs/*.txt       # 批量处理
    humanizer --list-styles                # 列出可用风格
    ```

  - 验证安装
    ```
    humanizer --version
    # 应输出版本号

    echo "这是一个由AI生成的示例文本，用于测试文本人性化处理功能。" | humanizer
    # 预期输出：处理后的自然语言文本
    ```

  - 卸载说明
    ```
    pip uninstall humanizer-agent
    rm -rf ~/.config/humanizer
    ```