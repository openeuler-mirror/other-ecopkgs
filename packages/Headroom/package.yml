name: Headroom
category: others
type: 源码安装
description: Lightweight AI agent context compression tool to reduce token usage
license: Apache-2.0
homepage: https://github.com/chopratejas/headroom

maintainer: lw520203
maintainer-email: 1823363429@qq.com

usage: |

  - 前置条件
    ```
    # 安装依赖（openEuler）
    sudo dnf install -y python3 python3-pip python3-devel git gcc
    curl -LsSf https://astral.sh/uv/install.sh | sh

    # 检查 Python 版本
    python --version
    # 需要 >= 3.8
    ```

  - 安装
    ```
    # 方式一：通过 uv 安装（推荐）
    uv venv .venv && source .venv/bin/activate
    uv pip install headroom

    # 方式二：通过 pip 安装（备选）
    pip install -i https://mirrors.aliyun.com/pypi/simple/ headroom
    ```

  - 基础配置
    ```
    export OPENAI_API_KEY="sk-xxx"

    # 配置示例
    config = {
        "compression_strategy": "summary",  # 压缩策略
        "max_tokens": 2048,                 # 最大 Token 数
        "model": "gpt-4o-mini",             # 压缩用模型
    }
    ```

  - 快速使用
    ```
    # 基本用法
    from headroom import Compressor

    compressor = Compressor(strategy="summary", max_tokens=2048)
    conversation = [
        {"role": "user", "content": "Hello! I need help with Python."},
        {"role": "assistant", "content": "Of course! What topic are you working on?"},
    ]
    compressed = compressor.compress(conversation)
    print(compressed)

    # 常用方法
    compressed = compressor.compress(messages)    # 压缩对话
    stats = compressor.stats()                    # 获取压缩统计
    ```

  - 验证安装
    ```
    python -c "import headroom; print(headroom.__version__)"

    pytest tests/ -v
    ```

  - 卸载说明
    ```
    pip uninstall headroom -y
    ```